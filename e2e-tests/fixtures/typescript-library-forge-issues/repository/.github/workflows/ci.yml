name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm

      - run: npm ci

      # `tsc` is the only thing that reads tsconfig.json — the library ships unbuilt, so nothing
      # else would catch a construct Node's type stripping cannot erase.
      - run: npm run typecheck

      # `!cancelled()` so a type error does not hide a failing test. The two answer different
      # questions and a run should report both.
      - run: npm test
        if: '!cancelled()'
